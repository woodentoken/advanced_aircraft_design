[tool.uv]
prerelease = "allow"

[project]
name = "aad-design"
version = "0.1.0"
description = "Advanced Aircraft Design Course Project - SAR mission"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aviary",
  "build_pyoptsparse",
  "pyoptsparse",
  "icecream>=2.1.8",
  "ipdb>=0.13.13",
  "polars>=1.34.0b1",
  "cyipopt>=1.6.1",
  "tabulate>=0.9.0",
  "ambiance>=1.3.1",
  "myst-nb>=1.3.0",
  "openaerostruct>=2.12.0",
  "testflo>=1.4.20",
]

[tool.uv.sources]
aviary = { path = "Aviary", editable = true }
build_pyoptsparse = { path = "build_pyoptsparse", editable = true }
pyoptsparse = { path = "pyoptsparse", editable = true }
