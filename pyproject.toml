[tool.uv]
prerelease = "allow"

[project]
name = "aad"
version = "0.1.0"
description = "Advanced Aircraft Design Course Project - SAR mission"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aviary",
  "dymos>=1.14.0",
  "jax>=0.4.29",
  "jaxlib==0.4.29",
  "icecream>=2.1.8",
  "ipdb>=0.13.13",
  "numpy>=1.26.4",
  "openmdao[all]>=3.40.0",
  "pandas>=2.3.2",
  "polars>=1.34.0b1",
  "scipy>=1.16.2",
  "matplotlib>=3.10.6",
]

[tool.uv.sources]
aviary = { path = "Aviary/" }
